version: 2

sources:
  - name: raw
    description: "Raw source data loaded from S3 into Snowflake"
    database: USED_VEHICLE_ANALYTICS
    schema: RAW_DATA
    tables:
      - name: RAW_VEHICLES
        description: "Raw used car listings from S3"
        
models:
  - name: stg_listings
    description: "Staging model that cleans and standardizes raw used car listings data."
    columns:
      - name: id
        description: "Unique identifier for each listing."
        tests:
          - unique
          - not_null

      - name: price
        description: "Listing price in USD."
        tests:
          - not_null

      - name: year
        description: "Manufacture year of the car."
        tests:
          - not_null

      - name: manufacturer
        description: "Car manufacturer (e.g., Toyota, Ford)."

      - name: model
        description: "Car model (e.g., Corolla, F-150)."

      - name: condition
        description: "Condition of the car (new, like new, good, fair, etc.)."
        tests:
          - accepted_values:
              values: ['new', 'like new', 'excellent', 'good', 'fair', 'salvage']

      - name: odometer
        description: "Mileage of the car in miles."

      - name: fuel
        description: "Fuel type (gas, diesel, electric, etc.)."

      - name: transmission
        description: "Type of transmission (automatic, manual, other)."

      - name: state
        description: "Two-letter US state code where the car is listed."

      - name: posted_at
        description: "Date when the listing was posted."
